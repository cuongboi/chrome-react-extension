        label: {
          show: true,
          position: 'inside',
          formatter: (params) => params.name,
        },
      }));

      const option = {
        tooltip: {
          trigger: 'axis',
          axisPointer: {
            type: 'shadow',
          },
          formatter: (params) => {
            const item = ganttData[params[0].dataIndex];
            let tooltip = item.name + '<br>';
            tooltip +=
              'Start: ' +
              new Date(item.startDate).toLocaleDateString() +
              '<br>';
            if (item.endDate) {
              tooltip += 'End: ' + new Date(item.endDate).toLocaleDateString();
            }
            return tooltip;
          },
        },
        xAxis: {
          type: 'time',
          axisLabel: {
            formatter: function (value) {
              const date = new Date(value);
              return date.toLocaleDateString();
            },
          },
        },
        yAxis: {
          type: 'category',
          data: ganttData.map((item) => item.name),
          inverse: true,
        },
        series: [
          {
            type: 'custom',
            renderItem: (params, api) => {
              const categoryIndex = api.value(0);
              const start = api.coord([api.value(1), categoryIndex]);
              const end = api.coord([api.value(2), categoryIndex]);
              const height = api.size([0, 1])[1] * 0.6;
              const rectShape = echarts.graphic.clipRectByRect(
                {
                  x: start[0],
                  y: start[1] - height / 2,
                  width: end[0] - start[0],
                  height: height,
                },
                {
                  x: params.coordSys.x,
                  y: params.coordSys.y,
                  width: params.coordSys.width,
                  height: params.coordSys.height,
                },
              );
              if (rectShape) {
                return {
                  type: 'rect',
                  shape: rectShape,
                  style: api.style(),
                };
              }
              return null;
            },
            encode: {
              x: ['startDate', 'endDate'],
              y: 0,
            },
            data: ganttData,
          },
        ],
      };
